name: release

# ponytail: Linux/macOS only, macOS unsigned (ad hoc) -- see docs/releasing.md for
# the full scope and upgrade paths. Trimmed down from upstream's matrix:
# no Windows (needs an Authenticode cert), no Docker image publish (needs
# a Docker Hub account), no Linux MLX (needs a 200 GB swap build host),
# and Linux builds run on GitHub-hosted runners without upstream's
# registry layer cache.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to embed in GOFLAGS when run manually (no tag push) -- e.g. 0.0.1-test'
        required: true

env:
  CGO_CFLAGS: '-O3'
  CGO_CXXFLAGS: '-O3'

jobs:
  setup-environment:
    runs-on: ubuntu-latest
    environment: release
    outputs:
      GOFLAGS: ${{ steps.goflags.outputs.GOFLAGS }}
      VERSION: ${{ steps.goflags.outputs.VERSION }}
      vendorsha: ${{ steps.goflags.outputs.vendorsha }}
    steps:
      - uses: actions/checkout@v4
      - name: Set environment
        id: goflags
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          echo GOFLAGS="'-ldflags=-w -s \"-X=github.com/borism/ollama-cluster/version.Version=${VERSION}\" \"-X=github.com/borism/ollama-cluster/server.mode=release\"'" | tee -a $GITHUB_OUTPUT
          echo VERSION="${VERSION}" | tee -a $GITHUB_OUTPUT
          echo vendorsha=$(cat LLAMA_CPP_VERSION)-$(cat MLX_VERSION)-$(cat MLX_C_VERSION) | tee -a $GITHUB_OUTPUT

  darwin-build:
    # Self-hosted: an ephemeral Tart VM (Apple Virtualization.framework) on
    # personal hardware, cloned fresh per run and destroyed after -- see
    # docs/mac-ci-runner-setup.md. Avoids GitHub's paid macos-26-xlarge
    # runner. SECURITY: this repo is public -- the "tart-ephemeral" label
    # must never be attached to a job triggered by pull_request or
    # pull_request_target (only tag pushes / workflow_dispatch, both
    # requiring push access), or anyone forking this repo could run
    # arbitrary code on that machine via a PR.
    runs-on: [self-hosted, macOS, tart-ephemeral]
    environment: release
    needs: setup-environment
    env:
      GOFLAGS: ${{ needs.setup-environment.outputs.GOFLAGS }}
      VERSION: ${{ needs.setup-environment.outputs.VERSION }}
      CGO_CFLAGS: '-mmacosx-version-min=14.0 -O3'
      CGO_CXXFLAGS: '-mmacosx-version-min=14.0 -O3'
      CGO_LDFLAGS: '-mmacosx-version-min=14.0 -O3'
      # scripts/build_darwin.sh (upstream's own script) signs+notarizes when
      # APPLE_IDENTITY is set and falls back to ad-hoc signing when it's
      # empty -- so this is a no-op fork until the "release" environment's
      # secrets (docs/releasing.md) are actually populated.
      APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify build toolchain
        # No pinned Xcode path here -- unlike a shared GitHub-hosted image
        # with several Xcodes side by side, this is one dedicated machine
        # with exactly one Xcode installed (docs/mac-ci-runner-setup.md
        # step 4); whatever `xcode-select` already points at is the one to
        # use. This step is a sanity check, not a selector.
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun --find metal
      - name: Import Developer ID certificate
        # The VM this runs in is a fresh clone destroyed right after this job
        # (docs/mac-ci-runner-setup.md) -- no temporary keychain lifecycle to
        # manage, the whole login keychain goes away with it. Skipped
        # entirely when the "release" environment has no signing secrets
        # (a workflow_dispatch test run on a branch, or before they're set up).
        if: ${{ env.APPLE_IDENTITY != '' }}
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          MAC_LOGIN_KEYCHAIN_PASSWORD: ${{ secrets.MAC_LOGIN_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k login.keychain-db \
              -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # Lets codesign use the imported key without an interactive
          # keychain-access prompt, which would hang a headless run.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$MAC_LOGIN_KEYCHAIN_PASSWORD" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            LLAMA_CPP_VERSION
            MLX_VERSION
            MLX_C_VERSION
      - run: |
          cmake -S . -B build/go-license -DOLLAMA_LLAMA_BACKENDS= -DOLLAMA_MLX_BACKENDS= -DOLLAMA_PAYLOAD_INSTALL_PREFIX=dist/darwin-arm64 "-DOLLAMA_GO_LICENSE_TARGETS=darwin/amd64;darwin/arm64"
          cmake --build build/go-license --target ollama-go-license
          # build+package only -- no `sign` (that only covers the CLI
          # tarball; the app step below signs+notarizes Ollama.app, which
          # embeds the same binaries, so signing here would be redundant).
          ./scripts/build_darwin.sh build package
      - name: Build Ollama.app (signed + notarized when APPLE_IDENTITY is set, ad-hoc otherwise)
        # Needs node@20 and typescript, which the golden image has
        # (docs/mac-ci-runner-setup.md). `app` also rewrites
        # dist/ollama-darwin.tgz in its flat layout, which the repackage
        # step below replaces, so this has to run before it.
        run: |
          ./scripts/build_darwin.sh app
          test -d dist/Ollama.app
          codesign --verify --deep dist/Ollama.app
          test -f dist/Ollama-darwin.zip
          if [ -n "$APPLE_IDENTITY" ]; then
              spctl --assess --type execute -vvv dist/Ollama.app
              test -f dist/Ollama.dmg
          fi
      - name: Repackage as bin/+lib/ollama (matches the Linux tarball shape)
        # build_darwin.sh's own ollama-darwin.tgz is a flat layout (kept for
        # other internal tooling, see .github/scripts/prepare_mlx_darwin.sh)
        # -- ml/path.go's darwin candidate list also accepts the standard
        # bin/+lib/ollama layout (exeDir/../lib/ollama), so install.sh can
        # share one download+extract routine across both OSes instead of
        # needing a macOS-specific layout.
        run: |
          rm -rf pkg
          mkdir -p pkg/bin pkg/lib/ollama
          cp dist/darwin/ollama pkg/bin/ollama
          cp dist/darwin/llama-server dist/darwin/llama-quantize pkg/lib/ollama/
          cp -a dist/darwin/lib/ollama/. pkg/lib/ollama/
          # Cluster RPC worker (arm64's RPC backend is linked into llama-server)
          test -x pkg/lib/ollama/ggml-rpc-server
          # RDMA over Thunderbolt (arm64 only, see cmake/local.cmake)
          otool -arch arm64 -L pkg/lib/ollama/ggml-rpc-server | grep -q 'librdma.*weak'
          tar czf dist/ollama-darwin.tgz -C pkg bin lib
      - name: Log build results
        run: |
          ls -l dist/
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-darwin
          # Ollama.dmg only exists when APPLE_IDENTITY is set (build_darwin.sh
          # only notarizes+staples a dmg when it can sign it); upload-artifact
          # warns rather than fails when a path matches nothing.
          path: |
            dist/ollama-darwin.tgz
            dist/Ollama-darwin.zip
            dist/Ollama.dmg

  # Linux: the same Dockerfile stages stock Ollama's release builds
  # (upstream release.yaml's linux-depends matrix, scripts/build_linux.sh's
  # tarball split), one backend per job so each gets a whole runner.
  #
  # ponytail: GitHub-hosted runners, no registry layer cache -- every
  # release rebuilds every backend from scratch (upstream caches layers in a
  # Docker Hub registry; the ROCm base alone is ~9 GB compressed). Upgrade
  # path: docker/build-push-action cache-from/cache-to against a GHCR
  # registry ref, same shape as upstream's. No MLX: upstream builds it with
  # a 200 GB swap file, which a hosted runner can't do; it's the optional
  # safetensors engine, shipped separately upstream anyway.
  linux-depends:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, target: llama-server-cpu }
          - { arch: amd64, target: llama-server-cuda_v12 }
          - { arch: amd64, target: llama-server-cuda_v13 }
          - { arch: amd64, target: llama-server-vulkan }
          - { arch: amd64, target: llama-server-rocm_v7_2 }
          - { arch: amd64, target: go }
          - { arch: arm64, target: llama-server-cpu }
          - { arch: arm64, target: llama-server-cuda_v12 }
          - { arch: arm64, target: llama-server-cuda_v13 }
          - { arch: arm64, target: llama-server-cuda_jetpack5 }
          - { arch: arm64, target: llama-server-cuda_jetpack6 }
          - { arch: arm64, target: go }
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    environment: release
    needs: setup-environment
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        # The amd64 base image (rocm/dev-almalinux-8, shared by every amd64
        # stage) and the JetPack images are ~5-9 GB compressed each; a
        # stock hosted runner doesn't have room for them plus a build.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/share/powershell
          sudo docker image prune --all --force
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          target: publish-${{ matrix.target }}
          outputs: type=local,dest=out
          provenance: false
          sbom: false
          build-args: |
            GOFLAGS=${{ needs.setup-environment.outputs.GOFLAGS }}
      # tar first: upload-artifact drops symlinks and exec bits
      - run: tar cf linux-${{ matrix.arch }}-${{ matrix.target }}.tar -C out . && ls -l *.tar && df -h /
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-${{ matrix.target }}
          path: linux-${{ matrix.arch }}-${{ matrix.target }}.tar
          retention-days: 1
          compression-level: 0

  linux-build:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    environment: release
    needs: [setup-environment, linux-depends]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-${{ matrix.arch }}-*
          path: parts
          merge-multiple: true
      - name: Assemble bin/ + lib/ollama
        run: |
          mkdir pkg
          for t in parts/*.tar; do tar xf "$t" -C pkg; done
          ls pkg/lib/ollama
      - name: Verify
        run: |
          pkg/bin/ollama --version
          pkg/lib/ollama/llama-server --version
          # Cluster RPC spillover needs both
          test -x pkg/lib/ollama/ggml-rpc-server
          ls pkg/lib/ollama/libggml-rpc*
          for d in cuda_v12 cuda_v13; do test -d pkg/lib/ollama/$d; done
          if [ ${{ matrix.arch }} = amd64 ]; then
            for d in vulkan rocm_v7_2; do test -d pkg/lib/ollama/$d; done
          else
            for d in cuda_jetpack5 cuda_jetpack6; do test -d pkg/lib/ollama/$d; done
          fi
      - name: Split into release tarballs
        # Same split as scripts/build_linux.sh: GPU extras that most machines
        # don't need (ROCm, JetPack) ship separately, and install.sh fetches
        # them only when it detects that hardware.
        run: |
          mkdir dist
          A=${{ matrix.arch }}
          if [ $A = amd64 ]; then
            tar c -C pkg --owner 0 --group 0 --exclude 'lib/ollama/rocm*' bin lib | zstd -19 -T0 >dist/ollama-linux-$A.tar.zst
            tar c -C pkg --owner 0 --group 0 lib/ollama/rocm_v7_2 | zstd -19 -T0 >dist/ollama-linux-$A-rocm.tar.zst
          else
            tar c -C pkg --owner 0 --group 0 --exclude 'lib/ollama/cuda_jetpack*' bin lib | zstd -19 -T0 >dist/ollama-linux-$A.tar.zst
            tar c -C pkg --owner 0 --group 0 lib/ollama/cuda_jetpack5 | zstd -19 -T0 >dist/ollama-linux-$A-jetpack5.tar.zst
            tar c -C pkg --owner 0 --group 0 lib/ollama/cuda_jetpack6 | zstd -19 -T0 >dist/ollama-linux-$A-jetpack6.tar.zst
          fi
          ls -l dist
          # GitHub release assets max out at 2 GiB
          for f in dist/*; do [ $(stat -c%s "$f") -lt 2147483648 ] || { echo "::error::$f is over 2 GiB"; exit 1; }; done
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-linux-${{ matrix.arch }}
          path: dist/*.tar.zst
          compression-level: 0

  # Final release process
  release:
    # workflow_dispatch runs (see the top-level `on:`) exist to iterate on
    # the build jobs above without cutting a real tag -- GITHUB_REF_NAME
    # there is a branch name, not a version, so this job (which publishes a
    # GitHub Release named after the tag) only makes sense for an actual
    # tag push.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: release
    needs: [darwin-build, linux-build]
    concurrency:
      group: release-publish
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: dist
          merge-multiple: true
      - name: Log dist contents
        run: |
          ls -l dist/
      - name: Copy install scripts to dist
        run: |
          cp scripts/install.sh dist/install.sh
      - name: Verify release artifacts
        run: |
          required=(
            dist/install.sh
            dist/ollama-linux-amd64.tar.zst
            dist/ollama-linux-amd64-rocm.tar.zst
            dist/ollama-linux-arm64.tar.zst
            dist/ollama-linux-arm64-jetpack5.tar.zst
            dist/ollama-linux-arm64-jetpack6.tar.zst
            dist/ollama-darwin.tgz
            dist/Ollama-darwin.zip
          )
          for payload in "${required[@]}"; do
            if [ ! -f "$payload" ]; then
              echo "::error::Missing expected release artifact: $payload"
              exit 1
            fi
          done
      - name: Generate checksum file
        run: find . -type f -not -name 'sha256sum.txt' | xargs sha256sum | tee sha256sum.txt
        working-directory: dist
      - name: Publish release artifacts
        shell: bash
        run: |
          retry() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::Attempt $attempt failed; retrying in $((attempt * 15))s: $*"
                sleep "$((attempt * 15))"
              fi
            done
            echo "::error::Failed after 3 attempts: $*"
            return 1
          }

          delete_assets() {
            local assets asset
            # Re-list on each attempt: a failed DELETE may still have removed the asset.
            assets=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/$1/assets" --jq '.[].url') || return 1
            while IFS= read -r asset; do
              [ -z "$asset" ] && continue
              gh api --method DELETE "$asset" || return 1
            done <<< "$assets"
          }

          # Upstream strips everything after the first '-' so -rcN builds
          # fold into one release; this fork's tags carry a -cluster.N
          # suffix that must stay distinct, so strip only an -rc suffix.
          RELEASE_VERSION="${GITHUB_REF_NAME%-rc*}"
          echo "Looking for existing release for ${RELEASE_VERSION}"
          OLD_TAG=$(gh release ls --json name,tagName | jq -r --arg version "$RELEASE_VERSION" '.[] | select(.name == $version) | .tagName')
          if [ -n "$OLD_TAG" ]; then
            RELEASE_ID=$(gh release view "$OLD_TAG" --json databaseId --jq .databaseId)
            echo "Deleting old assets from ${OLD_TAG}"
            retry delete_assets "$RELEASE_ID"
            echo "Updating release ${RELEASE_VERSION} to point to new tag ${GITHUB_REF_NAME}"
            gh release edit "$OLD_TAG" --tag "$GITHUB_REF_NAME"
          else
            echo "Creating new release ${RELEASE_VERSION} pointing to tag ${GITHUB_REF_NAME}"
            gh release create "$GITHUB_REF_NAME" \
              --title "$RELEASE_VERSION" \
              --draft \
              --generate-notes
          fi

          shopt -s nullglob
          pids=()
          for payload in dist/*.txt dist/*.tgz dist/*.tar.zst dist/*.sh dist/*.zip dist/*.dmg ; do
            # Publish the checksum manifest only after every payload has succeeded.
            [ "$payload" = dist/sha256sum.txt ] && continue
            echo "Uploading $payload"
            retry gh release upload "$GITHUB_REF_NAME" "$payload" --clobber &
            pids+=($!)
            sleep 1
          done
          echo "Waiting for uploads to complete"
          failed=0
          for pid in "${pids[@]}"; do
            if ! wait $pid; then
              echo "::error::Upload failed (pid $pid)"
              failed=1
            fi
          done
          if [ $failed -ne 0 ]; then
            echo "One or more uploads failed"
            exit 1
          fi
          retry gh release upload "$GITHUB_REF_NAME" dist/sha256sum.txt --clobber
          echo "done"
